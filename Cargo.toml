[package]
name = "wintermute-lucid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "wm-lucid — flight recorder for the agorabus bus: subscribes to the whole wm. prefix and persists every event to a rotating, turn-keyed structured log."
license = "MIT OR Apache-2.0"
authors = ["Joe Yen <jyen.tech@gmail.com>"]
repository = "https://github.com/j0yen/wintermute-lucid"

[[bin]]
name = "wm-lucid"
path = "src/main.rs"

[lib]
name = "wintermute_lucid"
path = "src/lib.rs"

[dependencies]
agorabus = { path = "../agorabus" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigpipe = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "io-std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
